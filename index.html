<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业点评 - 真实员工评价平台</title>
<meta name="description" content="查看真实员工对企业的评价，了解公司待遇、工作环境和发展前景">
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1A56DB;--blue-light:#1A56DB10;--blue-dark:#1550C8}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;line-height:1.6}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-outline{border:1.5px solid var(--blue);color:var(--blue);background:transparent}
.btn-outline:hover{background:var(--blue-light)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
input,select{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;background:#fff}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.tag-gray{background:#f1f5f9;color:#64748b}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-amber{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.spinner{width:32px;height:32px;border:3px solid var(--blue-light);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Header */
.header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-size:20px;font-weight:800;color:var(--blue);display:flex;align-items:center;gap:8px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;color:#475569;transition:all .15s}
.nav a:hover,.nav a.active{background:var(--blue-light);color:var(--blue);text-decoration:none}
/* Footer */
.footer{background:#fff;border-top:1px solid #e2e8f0;padding:32px 0;margin-top:60px;text-align:center;font-size:13px;color:#94a3b8}
.footer a{color:#64748b}
.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:12px}
/* Banner */
.banner{background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 0;text-align:center;font-size:12px;color:#92400e}
/* Hero */
.hero{text-align:center;padding:60px 20px 40px}
.hero h1{font-size:36px;font-weight:800;color:#0f172a;margin-bottom:8px}
.hero p{font-size:16px;color:#64748b;margin-bottom:28px}
.search-box{display:flex;max-width:600px;margin:0 auto;gap:8px;position:relative}
.search-box input{flex:1;padding:14px 48px 14px 20px;font-size:16px;border-radius:14px;border:2px solid #e2e8f0}
.search-box input:focus{border-color:var(--blue)}
.search-box .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.search-box button{padding:14px 28px;font-size:16px;border-radius:14px}
/* Stats */
.stats{display:flex;justify-content:center;gap:40px;margin-top:20px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:24px;font-weight:700;color:var(--blue)}
.stat-label{font-size:13px;color:#94a3b8;margin-top:2px}
/* City Filter */
.city-filter{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}
.city-btn{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;transition:all .15s}
.city-btn:hover,.city-btn.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
/* Company Grid */
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:20px}
.company-card{padding:20px;cursor:pointer;transition:all .2s}
.company-card:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(26,86,219,.08)}
.company-card-header{display:flex;align-items:flex-start;gap:14px}
.company-avatar{width:48px;height:48px;background:linear-gradient(135deg,var(--blue-light),#e8f0fe);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--blue);flex-shrink:0}
.company-name{font-size:16px;font-weight:600;color:#0f172a;line-height:1.3}
.company-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.company-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9}
/* Company Detail */
.detail-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px}
.detail-avatar{width:64px;height:64px;background:linear-gradient(135deg,var(--blue-light),#e8f0fe);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--blue);flex-shrink:0}
.detail-title{font-size:28px;font-weight:700;color:#0f172a}
.detail-subtitle{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.review-card{padding:20px;margin-bottom:12px}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.review-avatar{width:36px;height:36px;background:var(--blue-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--blue);flex-shrink:0}
.review-author{font-size:14px;font-weight:600}
.review-meta{font-size:12px;color:#94a3b8}
.review-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.review-content{font-size:14px;line-height:1.7;color:#334155;white-space:pre-line}
.review-issues{background:#f8fafc;border-radius:10px;padding:12px 16px;margin-top:12px}
.review-issues-title{font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
.review-issues-text{font-size:14px;color:#475569}
/* Layout */
.page{padding:32px 0}
.page-title{font-size:24px;font-weight:700;color:#0f172a;margin-bottom:4px}
.page-subtitle{font-size:14px;color:#94a3b8;margin-bottom:24px}
.sidebar-layout{display:grid;grid-template-columns:1fr 280px;gap:24px}
@media(max-width:768px){.sidebar-layout{grid-template-columns:1fr}}
/* Compliance */
.compliance-note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:20px}
.sidebar-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;margin-bottom:16px}
.sidebar-title{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:8px}
.sidebar-text{font-size:13px;color:#64748b;margin-bottom:12px}
/* Pagination */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:24px}
.pagination button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;border:1.5px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;transition:all .15s}
.pagination button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.pagination button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
/* Empty State */
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-icon{font-size:48px;margin-bottom:12px}
/* Legal pages */
.legal-content{max-width:800px;margin:0 auto}
.legal-content h2{font-size:20px;font-weight:700;margin:24px 0 12px;color:#0f172a}
.legal-content p,.legal-content li{font-size:14px;line-height:1.8;color:#475569;margin-bottom:8px}
.legal-content ul{padding-left:20px}
/* Back link */
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#64748b;margin-bottom:20px}
.back-link:hover{color:var(--blue)}
/* Result count */
.result-count{font-size:14px;color:#64748b;margin-bottom:16px}
.result-count strong{color:#0f172a}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;gap:10px;color:#94a3b8;font-size:14px}
/* Error */
.error-page{text-align:center;padding:80px 20px}
.error-page h2{font-size:22px;color:#475569;margin-bottom:8px}
</style>
</head>
<body>
<div class="banner">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务。</div>
<header class="header">
  <div class="container header-inner">
    <a href="#/" class="logo" onclick="navigate('#/')">
      <div class="logo-icon">评</div>
      企业点评
    </a>
    <nav class="nav">
      <a href="#/" class="active">首页</a>
      <a href="#/search">企业搜索</a>
      <a href="#/reviews">最新评价</a>
      <a href="#/complaint">企业申诉</a>
    </nav>
  </div>
</header>

<main id="app" class="container"><div class="loading"><div class="spinner"></div>加载中...</div></main>

<footer class="footer">
  <div class="container">
    <div class="footer-links">
      <a href="#/legal/user-agreement">用户协议</a>
      <a href="#/legal/privacy-policy">隐私政策</a>
      <a href="#/legal/disclaimer">免责声明</a>
      <a href="#/legal/review-convention">评价公约</a>
      <a href="#/legal/complaint-rules">申诉规则</a>
      <a href="#/legal/qualification">资质公示</a>
    </div>
    <p>企业点评平台 - 真实员工评价 | 仅供信息参考</p>
  </div>
</footer>

<script>
const BASE = '/enterprise-review-platform';
const DATA = { companies: null, reviews: null };

// Data loading
async function loadData() {
  if (DATA.companies) return;
  try {
    const [cRes, rRes] = await Promise.all([
      fetch(`${BASE}/data/companies.json`),
      fetch(`${BASE}/data/reviews.json`)
    ]);
    DATA.companies = await cRes.json();
    DATA.reviews = await rRes.json();
  } catch(e) {
    console.error('Data load failed:', e);
  }
}

// Router
function getRoute() {
  const hash = window.location.hash.slice(1) || '/';
  const [path, query] = hash.split('?');
  const params = new URLSearchParams(query || '');
  return { path, params };
}

function navigate(hash) {
  window.location.hash = hash;
}

// Render
async function render() {
  const app = document.getElementById('app');
  const { path, params } = getRoute();
  
  // Update nav active state
  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === `#${path}` || (path === '/' && a.getAttribute('href') === '#/'));
  });

  await loadData();

  if (path === '/' || path === '') {
    renderHome(app);
  } else if (path === '/search') {
    renderSearch(app, params);
  } else if (path === '/company') {
    renderCompany(app, params);
  } else if (path === '/reviews') {
    renderReviews(app);
  } else if (path === '/complaint') {
    renderComplaint(app);
  } else if (path.startsWith('/legal/')) {
    renderLegal(app, path);
  } else {
    renderNotFound(app);
  }
}

function renderHome(app) {
  app.innerHTML = `
    <div class="hero">
      <h1>企业点评平台</h1>
      <p>查看真实员工评价，了解公司真实情况</p>
      <div class="search-box">
        <input type="text" id="heroSearch" placeholder="输入企业名称，查看真实评价..." onkeydown="if(event.key==='Enter')navigate('#/search?q='+encodeURIComponent(this.value))">
        <button class="btn btn-primary" onclick="navigate('#/search?q='+encodeURIComponent(document.getElementById('heroSearch').value))">搜索</button>
      </div>
      <div class="stats">
        <div class="stat-item"><div class="stat-num">${(DATA.companies?.length || 11725).toLocaleString()}</div><div class="stat-label">收录企业</div></div>
        <div class="stat-item"><div class="stat-num">${(DATA.reviews ? Object.keys(DATA.reviews).length : 11725).toLocaleString()}</div><div class="stat-label">真实评价</div></div>
        <div class="stat-item"><div class="stat-num">10+</div><div class="stat-label">覆盖城市</div></div>
      </div>
    </div>
    <div class="card" style="text-align:center;margin-top:20px">
      <h3 style="font-size:18px;margin-bottom:8px">快速搜索</h3>
      <p style="color:#64748b;font-size:14px;margin-bottom:16px">输入企业名称，立即查看员工真实评价</p>
      <a href="#/search" class="btn btn-primary">开始搜索</a>
    </div>
  `;
}

function renderSearch(app, params) {
  const q = params.get('q') || '';
  const city = params.get('city') || '';
  let filtered = DATA.companies || [];
  if (q) {
    const lower = q.toLowerCase();
    filtered = filtered.filter(c => c.name.toLowerCase().includes(lower) || c.slug.toLowerCase().includes(lower) || (c.city && c.city.toLowerCase().includes(lower)));
  }
  if (city) filtered = filtered.filter(c => c.city === city);
  filtered.sort((a,b) => b.reviewCount - a.reviewCount);
  
  const cities = ['','深圳','广州','上海','北京','杭州','东莞','长沙','佛山','厦门','郑州'];
  const cityNames = ['全部','深圳','广州','上海','北京','杭州','东莞','长沙','佛山','厦门','郑州'];
  
  const page = parseInt(params.get('page') || '1');
  const pageSize = 12;
  const totalPages = Math.ceil(filtered.length / pageSize);
  const paged = filtered.slice((page-1)*pageSize, page*pageSize);
  
  let html = `<div class="page">
    <h1 class="page-title">企业搜索</h1>
    <p class="page-subtitle">共收录 ${DATA.companies?.length?.toLocaleString() || '11,725'} 家企业</p>
    <div class="search-box" style="margin-bottom:20px">
      <input type="text" id="searchInput" value="${escapeHtml(q)}" placeholder="输入企业名称，查看真实评价..." onkeydown="if(event.key==='Enter'){const q=this.value.trim();const city=document.getElementById('citySelect').value;navigate('#/search?'+(q?'q='+encodeURIComponent(q)+'&':'')+'city='+encodeURIComponent(city))}">
      <button class="btn btn-primary" onclick="const q=document.getElementById('searchInput').value.trim();const city=document.getElementById('citySelect').value;navigate('#/search?'+(q?'q='+encodeURIComponent(q)+'&':'')+'city='+encodeURIComponent(city))">搜索</button>
    </div>
    <div class="city-filter">
      ${cities.map((c,i) => `<button class="city-btn${city===c?' active':''}" onclick="navigate('#/search?${q?'q='+encodeURIComponent(q)+'&':''}city=${encodeURIComponent(c)}')">${cityNames[i]}</button>`).join('')}
    </div>`;
  
  if (q || city) {
    html += `<p class="result-count">共找到 <strong>${filtered.length.toLocaleString()}</strong> 家公司</p>`;
  }
  
  if (paged.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><p>未找到相关企业</p></div>`;
  } else {
    html += `<div class="company-grid">`;
    paged.forEach(c => {
      html += `<div class="card company-card" onclick="navigate('#/company?slug=${encodeURIComponent(c.slug)}')">
        <div class="company-card-header">
          <div class="company-avatar">${c.name.charAt(0)}</div>
          <div>
            <div class="company-name">${escapeHtml(c.name)}</div>
            <div class="company-meta">
              ${c.city ? `<span class="tag tag-gray">${escapeHtml(c.city)}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="company-footer">
          <span style="font-size:13px;color:#94a3b8">${c.reviewCount} 条评价</span>
          <span style="font-size:13px;color:var(--blue);font-weight:500">查看详情 →</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  
  if (totalPages > 1) {
    html += `<div class="pagination">`;
    html += `<button ${page<=1?'disabled':''} onclick="navigate('#/search?${q?'q='+encodeURIComponent(q)+'&':''}${city?'city='+encodeURIComponent(city)+'&':''}page=${page-1}')">上一页</button>`;
    for (let i = Math.max(1, page-4); i <= Math.min(totalPages, page+5); i++) {
      html += `<button class="${i===page?'active':''}" onclick="navigate('#/search?${q?'q='+encodeURIComponent(q)+'&':''}${city?'city='+encodeURIComponent(city)+'&':''}page=${i}')">${i}</button>`;
    }
    html += `<button ${page>=totalPages?'disabled':''} onclick="navigate('#/search?${q?'q='+encodeURIComponent(q)+'&':''}${city?'city='+encodeURIComponent(city)+'&':''}page=${page+1}')">下一页</button>`;
    html += `</div>`;
  }
  
  html += `</div>`;
  app.innerHTML = html;
}

function renderCompany(app, params) {
  const slug = params.get('slug') || '';
  if (!slug) {
    app.innerHTML = `<div class="error-page"><h2>请指定企业名称</h2><a href="#/search" class="btn btn-outline">返回搜索</a></div>`;
    return;
  }
  
  const company = (DATA.companies || []).find(c => c.slug === slug);
  if (!company) {
    app.innerHTML = `<div class="error-page"><h2>企业不存在</h2><a href="#/search" class="btn btn-outline">返回搜索</a></div>`;
    return;
  }
  
  const entry = DATA.reviews ? DATA.reviews[company.id] : null;
  const reviewList = entry ? (entry.reviews || []) : [];
  
  let html = `<div class="page">
    <a href="#/search" class="back-link">← 返回搜索</a>
    <div class="sidebar-layout">
      <div>
        <div class="card detail-header">
          <div class="detail-avatar">${company.name.charAt(0)}</div>
          <div>
            <div class="detail-title">${escapeHtml(company.name)}</div>
            <div class="detail-subtitle">
              ${company.city ? `<span class="tag tag-gray">${escapeHtml(company.city)}</span>` : ''}
              <span class="badge badge-blue">${company.reviewCount} 条评价</span>
            </div>
          </div>
        </div>
        <div class="compliance-note">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务，不对评价内容的真实性、准确性负责。</div>
        <h2 style="font-size:18px;font-weight:700;margin-bottom:16px">员工评价（共 ${reviewList.length} 条）</h2>`;
  
  if (reviewList.length === 0) {
    html += `<div class="card" style="text-align:center;padding:40px"><p style="color:#94a3b8">暂无评价</p></div>`;
  } else {
    reviewList.forEach(r => {
      html += `<div class="card review-card">
        <div class="review-header">
          <div class="review-avatar">匿</div>
          <div>
            <div class="review-author">匿名用户</div>
            <div class="review-meta">${escapeHtml(r.city || company.city || '')} · 来源数 ${r.sourceCount || 1}</div>
          </div>
        </div>`;
      if (r.tags && r.tags.length > 0) {
        html += `<div class="review-tags">${r.tags.map(t => `<span class="tag tag-blue">${escapeHtml(t)}</span>`).join('')}</div>`;
      }
      html += `<div class="review-content">${escapeHtml(r.content || '')}</div>`;
      if (r.issues) {
        html += `<div class="review-issues"><div class="review-issues-title">主要问题</div><div class="review-issues-text">${escapeHtml(r.issues)}</div></div>`;
      }
      html += `</div>`;
    });
  }
  
  html += `</div>
      <div>
        <div class="sidebar-card">
          <div class="sidebar-title">企业申诉</div>
          <div class="sidebar-text">如果您是该企业负责人，可对不实评价进行申诉</div>
          <a href="#/complaint" class="btn btn-outline btn-sm" style="width:100%">发起申诉</a>
        </div>
        <div class="sidebar-card">
          <div class="sidebar-title">企业信息</div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#94a3b8">城市</span><span>${escapeHtml(company.city || '-')}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#94a3b8">评价数</span><span>${company.reviewCount} 条</span></div>
        </div>
      </div>
    </div>
  </div>`;
  app.innerHTML = html;
}

function renderReviews(app) {
  const allReviews = [];
  if (DATA.reviews) {
    Object.values(DATA.reviews).forEach(entry => {
      if (entry.reviews) {
        entry.reviews.forEach(r => {
          allReviews.push({ ...r, companyName: entry.companyName, companySlug: entry.slug, companyId: entry.companyId });
        });
      }
    });
  }
  allReviews.sort((a,b) => (b.sourceCount||0) - (a.sourceCount||0));
  const recent = allReviews.slice(0, 50);
  
  let html = `<div class="page">
    <h1 class="page-title">最新评价</h1>
    <p class="page-subtitle">共 ${allReviews.length.toLocaleString()} 条真实评价</p>`;
  
  if (recent.length === 0) {
    html += `<div class="empty"><p>暂无评价</p></div>`;
  } else {
    recent.forEach(r => {
      html += `<div class="card review-card" style="cursor:pointer" onclick="navigate('#/company?slug=${encodeURIComponent(r.companySlug)}')">
        <div class="review-header">
          <div class="review-avatar">匿</div>
          <div>
            <div class="review-author">匿名用户</div>
            <div class="review-meta">${escapeHtml(r.companyName)} · ${escapeHtml(r.city || '')}</div>
          </div>
        </div>`;
      if (r.tags && r.tags.length > 0) {
        html += `<div class="review-tags">${r.tags.map(t => `<span class="tag tag-blue">${escapeHtml(t)}</span>`).join('')}</div>`;
      }
      html += `<div class="review-content">${escapeHtml((r.content || '').slice(0, 200))}${(r.content||'').length > 200 ? '...' : ''}</div>`;
      html += `</div>`;
    });
  }
  
  html += `</div>`;
  app.innerHTML = html;
}

function renderNotFound(app) {
  app.innerHTML = `<div class="error-page">
    <h2>页面不存在</h2>
    <p style="color:#94a3b8;margin-bottom:16px">您访问的页面未找到</p>
    <a href="#/" class="btn btn-primary">返回首页</a>
  </div>`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
window.addEventListener('hashchange', render);
window.addEventListener('load', render);
</script>
