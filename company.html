<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业详情 - 职得</title>
<meta name="description" content="查看真实员工评价，了解公司真实情况">
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

*,::before,::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1a1a1a;
  --ink-light:#4a4a4a;
  --ink-muted:#8a8a8a;
  --cream:#faf8f5;
  --cream-dark:#f0ede8;
  --paper:#ffffff;
  --amber:#d4923a;
  --amber-light:#fdf3e7;
  --amber-dark:#b87a2a;
  --rust:#c0392b;
  --rust-light:#fdf0ef;
  --sage:#5b8c5a;
  --sage-light:#eef7ed;
  --border:#e8e4df;
  --border-light:#f0ede8;
  --shadow-sm:0 1px 2px rgba(26,26,26,.04);
  --shadow-md:0 4px 16px rgba(26,26,26,.06);
  --shadow-lg:0 12px 40px rgba(26,26,26,.08);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --radius-xl:24px;
  --font-sans:'Noto Sans SC',-apple-system,sans-serif;
  --font-serif:'Noto Serif SC',Georgia,serif;
}

html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::selection{background:var(--amber-light);color:var(--amber-dark)}

a{color:var(--amber);text-decoration:none;transition:color .2s}
a:hover{color:var(--amber-dark)}

.container{max-width:1140px;margin:0 auto;padding:0 24px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:all .25s;text-decoration:none;
  font-family:var(--font-sans);letter-spacing:.01em;
}
.btn-primary{
  background:var(--ink);color:#fff;
  box-shadow:0 2px 8px rgba(26,26,26,.15);
}
.btn-primary:hover{background:#333;transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,26,26,.2);text-decoration:none;color:#fff}
.btn-accent{
  background:var(--amber);color:#fff;
  box-shadow:0 2px 8px rgba(212,146,58,.25);
}
.btn-accent:hover{background:var(--amber-dark);transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,146,58,.35);text-decoration:none;color:#fff}
.btn-outline{
  border:1.5px solid var(--border);color:var(--ink-light);background:transparent;
}
.btn-outline:hover{background:var(--cream-dark);border-color:var(--ink-muted);text-decoration:none;color:var(--ink)}
.btn-ghost{
  background:transparent;color:var(--ink-muted);padding:8px 16px;
}
.btn-ghost:hover{background:var(--cream-dark);color:var(--ink);text-decoration:none}
.btn-sm{padding:7px 16px;font-size:13px;border-radius:var(--radius-sm)}
.btn-lg{padding:14px 32px;font-size:16px;border-radius:var(--radius-lg)}

/* Form elements */
input,textarea,select{
  width:100%;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:var(--radius);font-size:14px;outline:none;
  transition:border-color .25s,box-shadow .25s;background:var(--paper);
  font-family:var(--font-sans);color:var(--ink);
}
input:focus,textarea:focus,select:focus{
  border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-light);
}
textarea{resize:vertical;min-height:120px;line-height:1.7}

/* Tags & Badges */
.tag{
  display:inline-flex;align-items:center;padding:4px 12px;
  border-radius:20px;font-size:12px;font-weight:500;letter-spacing:.01em;
}
.tag-amber{background:var(--amber-light);color:var(--amber-dark)}
.tag-sage{background:var(--sage-light);color:var(--sage)}
.tag-rust{background:var(--rust-light);color:var(--rust)}
.tag-neutral{background:var(--cream-dark);color:var(--ink-muted)}

.badge{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;
}
.badge-ink{background:var(--ink);color:#fff}
.badge-amber{background:var(--amber-light);color:var(--amber-dark)}

/* Spinner */
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.header{
  background:rgba(250,248,245,.92);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light);
  position:sticky;top:0;z-index:100;
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;height:64px;
}
.logo{
  font-family:var(--font-serif);font-size:22px;font-weight:900;
  color:var(--ink);display:flex;align-items:center;gap:10px;text-decoration:none;
  letter-spacing:-.02em;
}
.logo:hover{text-decoration:none;color:var(--ink)}
.logo-mark{
  width:36px;height:36px;background:var(--ink);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;font-family:var(--font-sans);
}
.nav{display:flex;align-items:center;gap:2px}
.nav a{
  padding:8px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;
  color:var(--ink-muted);transition:all .2s;text-decoration:none;
  letter-spacing:.01em;
}
.nav a:hover,.nav a.active{
  background:var(--cream-dark);color:var(--ink);text-decoration:none;
}
.nav a.nav-accent{
  background:var(--amber);color:#fff;font-weight:600;
}
.nav a.nav-accent:hover{background:var(--amber-dark);color:#fff}

/* Footer */
.footer{
  background:var(--ink);color:rgba(255,255,255,.55);
  padding:48px 0 32px;margin-top:80px;
}
.footer-grid{
  display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;
  margin-bottom:40px;
}
.footer-brand{font-family:var(--font-serif);font-size:18px;font-weight:700;color:#fff;margin-bottom:8px}
.footer-desc{font-size:13px;line-height:1.8;color:rgba(255,255,255,.45)}
.footer-title{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.footer-links{display:flex;flex-direction:column;gap:8px}
.footer-links a{font-size:13px;color:rgba(255,255,255,.45);text-decoration:none;transition:color .2s}
.footer-links a:hover{color:var(--amber)}
.footer-bottom{
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:20px;text-align:center;font-size:12px;color:rgba(255,255,255,.3);
}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;gap:24px}}

/* Banner */
.banner{
  background:var(--amber-light);border-bottom:1px solid rgba(212,146,58,.15);
  padding:8px 0;text-align:center;font-size:12px;color:var(--amber-dark);
  letter-spacing:.02em;
}

/* Cards */
.card{
  background:var(--paper);border-radius:var(--radius-lg);
  border:1px solid var(--border);padding:24px;
  box-shadow:var(--shadow-sm);transition:box-shadow .3s,transform .3s;
}
.card-hover:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}

/* Page layout */
.page{padding:40px 0}
.page-header{margin-bottom:32px}
.page-title{
  font-family:var(--font-serif);font-size:32px;font-weight:900;
  color:var(--ink);margin-bottom:6px;letter-spacing:-.02em;
}
.page-subtitle{font-size:15px;color:var(--ink-muted)}

/* Animations */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
.anim-fade-in{animation:fadeIn .5s ease-out}
.anim-fade-up{animation:fadeInUp .6s ease-out}
.anim-delay-1{animation-delay:.1s;animation-fill-mode:both}
.anim-delay-2{animation-delay:.2s;animation-fill-mode:both}
.anim-delay-3{animation-delay:.3s;animation-fill-mode:both}
.anim-delay-4{animation-delay:.4s;animation-fill-mode:both}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--cream-dark) 25%,var(--border-light) 50%,var(--cream-dark) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Company card */
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.company-card{display:block;padding:20px 24px;cursor:pointer;text-decoration:none;color:inherit}
.company-card:hover{border-color:var(--amber);text-decoration:none}
.company-card-header{display:flex;align-items:flex-start;gap:14px}
.company-avatar{
  width:44px;height:44px;background:linear-gradient(135deg,#fdf3e7,#f0ede8);
  border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--amber-dark);flex-shrink:0;
  font-family:var(--font-sans);
}
.company-name{
  font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.company-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.company-stats{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light)}
.company-review-count{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:4px}
.company-arrow{font-size:13px;color:var(--amber);font-weight:600;transition:transform .2s}
.company-card:hover .company-arrow{transform:translateX(3px)}

/* Review card */
.review-card{padding:24px;margin-bottom:14px}
.review-card-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.review-avatar{
  width:40px;height:40px;background:var(--cream-dark);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:var(--ink-muted);flex-shrink:0;
}
.review-author{font-size:14px;font-weight:600;color:var(--ink)}
.review-meta{font-size:12px;color:var(--ink-muted);margin-top:2px}
.review-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.review-body{
  font-size:14px;line-height:1.85;color:var(--ink-light);
  position:relative;padding-left:0;
}
.review-body::before{
  content:'"';
  font-family:var(--font-serif);font-size:48px;color:var(--amber);
  line-height:0;vertical-align:-14px;margin-right:4px;opacity:.4;
}
.review-source{font-size:12px;color:var(--ink-muted);margin-top:12px;display:flex;align-items:center;gap:6px}

/* Detail page */
.detail-header{display:flex;align-items:flex-start;gap:20px;padding:28px}
.detail-avatar{
  width:72px;height:72px;background:linear-gradient(135deg,#fdf3e7,#f0ede8);
  border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:var(--amber-dark);flex-shrink:0;
  font-family:var(--font-sans);
}
.detail-name{font-family:var(--font-serif);font-size:28px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.detail-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.sidebar-layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:768px){.sidebar-layout{grid-template-columns:1fr}}
.sidebar-card{background:var(--paper);border-radius:var(--radius-lg);border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.sidebar-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.sidebar-text{font-size:13px;color:var(--ink-muted);margin-bottom:12px;line-height:1.7}

/* Compliance note */
.compliance-note{
  background:var(--amber-light);border:1px solid rgba(212,146,58,.15);
  border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--amber-dark);
  margin-bottom:24px;line-height:1.6;
}

/* Pagination */
.pagination{display:flex;justify-content:center;gap:4px;margin-top:32px}
.pagination a,.pagination span{
  padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  border:1.5px solid var(--border);background:var(--paper);color:var(--ink-muted);
  text-decoration:none;transition:all .2s;min-width:38px;text-align:center;
}
.pagination a:hover{border-color:var(--amber);color:var(--amber);text-decoration:none}
.pagination .active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pagination .disabled{opacity:.35;pointer-events:none}

/* City filter */
.city-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.city-btn{
  padding:6px 18px;border-radius:20px;font-size:13px;font-weight:500;
  border:1.5px solid var(--border);background:var(--paper);color:var(--ink-muted);
  cursor:pointer;transition:all .2s;text-decoration:none;
}
.city-btn:hover,.city-btn.active{border-color:var(--amber);background:var(--amber-light);color:var(--amber-dark);text-decoration:none}

/* Search */
.search-box{display:flex;max-width:560px;gap:8px}
.search-box input{flex:1;padding:14px 20px;font-size:16px;border-radius:var(--radius-lg);border:2px solid var(--border)}
.search-box input:focus{border-color:var(--amber)}
.search-box button{padding:14px 28px;font-size:16px;border-radius:var(--radius-lg);white-space:nowrap}

/* Hero */
.hero{
  text-align:center;padding:80px 20px 60px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 30% 20%,rgba(212,146,58,.06) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(212,146,58,.04) 0%,transparent 60%);
  pointer-events:none;
}
.hero h1{
  font-family:var(--font-serif);font-size:clamp(32px,5vw,52px);font-weight:900;
  color:var(--ink);margin-bottom:12px;letter-spacing:-.03em;line-height:1.2;
  position:relative;
}
.hero h1 span{color:var(--amber)}
.hero p{
  font-size:17px;color:var(--ink-muted);margin-bottom:32px;max-width:480px;
  margin-left:auto;margin-right:auto;line-height:1.7;
}
.hero-search{display:flex;max-width:560px;margin:0 auto;gap:8px;position:relative}
.hero-search input{
  flex:1;padding:16px 24px;font-size:16px;border-radius:var(--radius-xl);
  border:2px solid var(--border);background:var(--paper);
  box-shadow:var(--shadow-md);
}
.hero-search input:focus{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-light),var(--shadow-md)}
.hero-search button{padding:16px 32px;font-size:16px;border-radius:var(--radius-xl);white-space:nowrap}

/* Stats bar */
.stats-bar{
  display:flex;justify-content:center;gap:48px;margin-top:20px;
  flex-wrap:wrap;position:relative;
}
.stat-item{text-align:center}
.stat-num{
  font-family:var(--font-serif);font-size:28px;font-weight:900;color:var(--ink);
  letter-spacing:-.02em;
}
.stat-label{font-size:13px;color:var(--ink-muted);margin-top:4px;letter-spacing:.02em}
.stat-divider{width:1px;background:var(--border);align-self:stretch}

/* Empty state */
.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty h3{font-family:var(--font-serif);font-size:18px;color:var(--ink-muted);margin-bottom:8px}
.empty p{font-size:14px;color:var(--ink-muted);margin-bottom:20px}

/* Back link */
.back-link{
  display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-muted);
  margin-bottom:24px;text-decoration:none;transition:color .2s;
}
.back-link:hover{color:var(--ink);text-decoration:none}
.back-link svg{width:16px;height:16px}

/* Section title */
.section-title{
  font-family:var(--font-serif);font-size:22px;font-weight:700;
  color:var(--ink);margin-bottom:6px;letter-spacing:-.01em;
}
.section-subtitle{font-size:14px;color:var(--ink-muted);margin-bottom:20px}

/* Post form */
.post-form{max-width:680px;margin:0 auto}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:.02em}
.form-hint{font-size:12px;color:var(--ink-muted);margin-top:4px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-pill{position:relative}
.checkbox-pill input{position:absolute;opacity:0;pointer-events:none}
.checkbox-pill label{
  display:inline-flex;align-items:center;padding:6px 16px;border-radius:20px;
  font-size:13px;font-weight:500;border:1.5px solid var(--border);
  background:var(--paper);color:var(--ink-muted);cursor:pointer;
  transition:all .2s;user-select:none;
}
.checkbox-pill input:checked+label{
  background:var(--rust-light);border-color:var(--rust);color:var(--rust);
}

/* Success state */
.success-state{text-align:center;padding:60px 20px}
.success-icon{
  width:72px;height:72px;background:var(--sage-light);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:32px;
}
.success-title{font-family:var(--font-serif);font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px}
.success-text{font-size:14px;color:var(--ink-muted);margin-bottom:24px;line-height:1.7}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 24px;border-radius:var(--radius);
  font-size:14px;font-weight:500;z-index:1000;box-shadow:var(--shadow-lg);
  animation:fadeInUp .3s ease-out;
}

/* Legal content */
.legal-content{max-width:720px;margin:0 auto}
.legal-content h2{
  font-family:var(--font-serif);font-size:20px;font-weight:700;
  margin:28px 0 12px;color:var(--ink);
}
.legal-content h3{font-size:16px;font-weight:600;margin:20px 0 8px;color:var(--ink)}
.legal-content p,.legal-content li{font-size:14px;line-height:1.9;color:var(--ink-light);margin-bottom:10px}
.legal-content ul{padding-left:20px;margin-bottom:12px}

/* Result count */
.result-count{font-size:14px;color:var(--ink-muted);margin-bottom:16px}
.result-count strong{color:var(--ink);font-weight:600}

/* Loading */
.loading{text-align:center;padding:48px 20px;color:var(--ink-muted)}

/* Error */
.error-page{text-align:center;padding:80px 20px}
.error-page h2{font-family:var(--font-serif);font-size:20px;color:var(--ink);margin-bottom:8px}
.error-page p{color:var(--ink-muted);margin-bottom:20px}

/* Responsive */
@media(max-width:768px){
  .company-grid{grid-template-columns:1fr}
  .hero{padding:48px 20px 36px}
  .hero h1{font-size:28px}
  .hero-search{flex-direction:column}
  .hero-search button{width:100%}
  .stats-bar{gap:24px}
  .header-inner{flex-wrap:wrap;height:auto;padding:12px 0}
  .nav{overflow-x:auto;flex-wrap:nowrap;gap:2px;padding-bottom:4px}
  .nav a{white-space:nowrap;font-size:13px;padding:6px 12px}
  .page-title{font-size:24px}
  .detail-header{flex-direction:column;align-items:flex-start}
  .search-box{flex-direction:column}
  .search-box button{width:100%}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-muted)}
</style>
</head>
<body>
<div class="banner">以上评价均为用户个人观点，不代表本平台立场。</div>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">评</div>职得
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="search.html">企业搜索</a>
      <a href="reviews.html">最新评价</a>
      <a href="complaint.html">企业申诉</a>
      <a href="post.html" class="nav-accent">写评价</a>
    </nav>
  </div>
</header>

<main class="container">
<div class="page" id="companyPage"><div class="loading"><div class="spinner"></div><p>加载中...</p></div></div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">职得</div>
        <div class="footer-desc">真实员工评价平台，帮助求职者了解企业真实情况。所有评价均来自用户分享，仅供信息参考。</div>
      </div>
      <div>

var slug = new URLSearchParams(location.search).get('slug');
if (!slug) {
  document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>请指定企业名称</h2><p>请从搜索页面选择一家企业</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';

  var base = location.pathname.replace(/company\.html.*$/, '');
  loadCompany(base, slug);
}

function esc(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadCompany(base, slug) {
  fetch(base + 'data/search-index.json').then(function(r){return r.json()}).then(function(index) {
    var company = null;
    for (var i = 0; i < index.length; i++) {
      if (index[i].s === slug) { company = index[i]; break; }
    }
    if (!company) {
      document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>企业不存在</h2><p>未找到该企业信息</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';
      return;
    }
    renderCompanyHeader(company);
    loadReviews(base, company);
  }).catch(function() {
    document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>加载失败</h2><p>请刷新页面重试</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';
  });
}

function renderCompanyHeader(company) {
  var h = '<a href="search.html" class="back-link"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>返回搜索</a>';
  h += '<div class="sidebar-layout"><div>';
  h += '<div class="card detail-header">';
  h += '<div class="detail-avatar">' + esc(company.n.charAt(0)) + '</div>';
  h += '<div><div class="detail-name">' + esc(company.n) + '</div>';
  h += '<div class="detail-meta">';
  if (company.c) h += '<span class="tag tag-neutral">' + esc(company.c) + '</span>';
  h += '<span class="badge badge-amber">' + company.r + ' 条评价</span>';
  h += '</div></div></div>';
  h += '<div class="compliance-note">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务，不对评价内容的真实性、准确性负责。</div>';
  h += '<h2 class="section-title">员工评价</h2>';
  h += '<div class="loading"><div class="spinner"></div><p>评价加载中...</p></div>';
  h += '</div><div>';

  h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--ink-muted)">城市</span><span>' + esc(company.c || '-') + '</span></div>';
  h += '<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--ink-muted)">评价数</span><span>' + company.r + ' 条</span></div>';
  h += '</div></div></div>';
  document.getElementById('companyPage').innerHTML = h;
}

function loadReviews(base, company) {
  var reviewFile = company.f || company.c || '其他';
  var url = base + 'data/reviews/' + encodeURIComponent(reviewFile) + '.json';
  fetch(url).then(function(r){return r.json()}).then(function(chunk){
    var entry = chunk[company.i];
    showReviews(company, entry ? (entry.reviews || []) : []);
  }).catch(function() {
    var city = company.c || '其他';
    var fallbackUrl = base + 'data/reviews/' + encodeURIComponent(city) + '.json';
    fetch(fallbackUrl).then(function(r){return r.json()}).then(function(chunk){
      var entry = chunk[company.i];
      showReviews(company, entry ? (entry.reviews || []) : []);
    }).catch(function() {
      showReviews(company, []);
    });
  });
}

function showReviews(company, reviewList) {
  var h = '<a href="search.html" class="back-link"><svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>返回搜索</a>';

  if (reviewList.length === 0) {
    h += '<div class="card" style="text-align:center;padding:40px"><p style="color:var(--ink-muted)">暂无评价</p><a href="post.html?company=' + encodeURIComponent(company.n) + '" class="btn btn-accent btn-sm" style="margin-top:12px">撰写第一条评价</a></div>';
  } else {
    for (var j = 0; j < reviewList.length; j++) {
      var r = reviewList[j];
      h += '<div class="card review-card">';
      h += '<div class="review-card-header"><div class="review-avatar">匿</div><div>';
      h += '<div class="review-author">匿名用户</div>';
      h += '<div class="review-meta">' + esc(company.n) + ' · ' + esc(company.c || '') + '</div>';
      h += '</div></div>';
      if (r.tags && r.tags.length > 0) {
        h += '<div class="review-tags">';
        for (var k = 0; k < r.tags.length; k++) {
          h += '<span class="tag tag-rust">' + esc(r.tags[k]) + '</span>';
        }
        h += '</div>';
      }
      h += '<div class="review-body">' + esc(r.content || '').replace(/\n/g, '<br>') + '</div>';

    }
