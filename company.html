<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业详情 - 企业点评</title>
<meta name="description" content="查看真实员工对企业的评价，了解公司待遇、工作环境和发展前景">
<style>*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1A56DB;--blue-light:#1A56DB10;--blue-dark:#1550C8}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;line-height:1.6}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark);text-decoration:none}
.btn-outline{border:1.5px solid var(--blue);color:var(--blue);background:transparent}
.btn-outline:hover{background:var(--blue-light);text-decoration:none}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
input,select{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;background:#fff}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.tag-gray{background:#f1f5f9;color:#64748b}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.spinner{width:32px;height:32px;border:3px solid var(--blue-light);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.header{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-size:20px;font-weight:800;color:var(--blue);display:flex;align-items:center;gap:8px;text-decoration:none}
.logo:hover{text-decoration:none}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;color:#475569;transition:all .15s;text-decoration:none}
.nav a:hover,.nav a.active{background:var(--blue-light);color:var(--blue);text-decoration:none}
.footer{background:#fff;border-top:1px solid #e2e8f0;padding:32px 0;margin-top:60px;text-align:center;font-size:13px;color:#94a3b8}
.footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:12px}
.footer-links a{color:#64748b;text-decoration:none}
.footer-links a:hover{color:var(--blue)}
.banner{background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 0;text-align:center;font-size:12px;color:#92400e}
.hero{text-align:center;padding:60px 20px 40px}
.hero h1{font-size:36px;font-weight:800;color:#0f172a;margin-bottom:8px}
.hero p{font-size:16px;color:#64748b;margin-bottom:28px}
.search-box{display:flex;max-width:600px;margin:0 auto;gap:8px}
.search-box input{flex:1;padding:14px 20px;font-size:16px;border-radius:14px;border:2px solid #e2e8f0}
.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:14px 28px;font-size:16px;border-radius:14px;white-space:nowrap}
.stats{display:flex;justify-content:center;gap:40px;margin-top:20px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:24px;font-weight:700;color:var(--blue)}
.stat-label{font-size:13px;color:#94a3b8;margin-top:2px}
.city-filter{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}
.city-btn{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;transition:all .15s;text-decoration:none}
.city-btn:hover,.city-btn.active{border-color:var(--blue);background:var(--blue-light);color:var(--blue);text-decoration:none}
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:20px}
.company-card{display:block;padding:20px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit}
.company-card:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(26,86,219,.08);text-decoration:none}
.company-card-header{display:flex;align-items:flex-start;gap:14px}
.company-avatar{width:48px;height:48px;background:linear-gradient(135deg,var(--blue-light),#e8f0fe);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--blue);flex-shrink:0}
.company-name-text{font-size:16px;font-weight:600;color:#0f172a;line-height:1.3}
.company-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.company-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9}
.detail-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px}
.detail-avatar{width:64px;height:64px;background:linear-gradient(135deg,var(--blue-light),#e8f0fe);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--blue);flex-shrink:0}
.detail-title{font-size:28px;font-weight:700;color:#0f172a}
.detail-subtitle{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.review-card{padding:20px;margin-bottom:12px}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.review-avatar{width:36px;height:36px;background:var(--blue-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--blue);flex-shrink:0}
.review-author{font-size:14px;font-weight:600}
.review-meta{font-size:12px;color:#94a3b8}
.review-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.review-content{font-size:14px;line-height:1.7;color:#334155;white-space:pre-line}
.review-issues{background:#f8fafc;border-radius:10px;padding:12px 16px;margin-top:12px}
.review-issues-title{font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px}
.review-issues-text{font-size:14px;color:#475569}
.page{padding:32px 0}
.page-title{font-size:24px;font-weight:700;color:#0f172a;margin-bottom:4px}
.page-subtitle{font-size:14px;color:#94a3b8;margin-bottom:24px}
.sidebar-layout{display:grid;grid-template-columns:1fr 280px;gap:24px}
@media(max-width:768px){.sidebar-layout{grid-template-columns:1fr}}
.compliance-note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:13px;color:#92400e;margin-bottom:20px}
.sidebar-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;margin-bottom:16px}
.sidebar-title{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:8px}
.sidebar-text{font-size:13px;color:#64748b;margin-bottom:12px}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:24px}
.pagination a,.pagination span{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;border:1.5px solid #e2e8f0;background:#fff;color:#475569;text-decoration:none;transition:all .15s}
.pagination a:hover{border-color:var(--blue);color:var(--blue);text-decoration:none}
.pagination .active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pagination .disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.legal-content{max-width:800px;margin:0 auto}
.legal-content h2{font-size:20px;font-weight:700;margin:24px 0 12px;color:#0f172a}
.legal-content p,.legal-content li{font-size:14px;line-height:1.8;color:#475569;margin-bottom:8px}
.legal-content ul{padding-left:20px}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#64748b;margin-bottom:20px;text-decoration:none}
.back-link:hover{color:var(--blue);text-decoration:none}
.result-count{font-size:14px;color:#64748b;margin-bottom:16px}
.result-count strong{color:#0f172a}
.loading{text-align:center;padding:40px 20px;color:#94a3b8}
.error-page{text-align:center;padding:80px 20px}
.error-page h2{font-size:22px;color:#475569;margin-bottom:8px}
.error-page p{color:#94a3b8;margin-bottom:16px}
</style>

</head>
<body>
<div class="banner">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务。</div>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">评</div>企业点评
    </a>
    <nav class="nav"><a href="index.html">首页</a><a href="search.html" class=active>企业搜索</a><a href="reviews.html">最新评价</a><a href="complaint.html">企业申诉</a></nav>
  </div>
</header>
<main class="container">
<div class="page" id="companyPage">
  <a href="search.html" class="back-link">← 返回搜索</a>
  <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
</div>
<script>
(function(){
  var slug = new URLSearchParams(location.search).get('slug');
  if (!slug) {
    document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>请指定企业名称</h2><p>请从搜索页面选择一家企业</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';
    return;
  }
  var base = location.pathname.replace(/company\.html.*$/, '');
  // Step 1: Load search index to find company
  fetch(base + 'data/search-index.json').then(function(r){return r.json()}).then(function(index){
    var company = null;
    for (var i = 0; i < index.length; i++) {
      if (index[i].s === slug) { company = index[i]; break; }
    }
    if (!company) {
      document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>企业不存在</h2><p>未找到该企业信息</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';
      return;
    }
    renderCompanyHeader(company);
    // Step 2: Directly load reviews using the reviewFile from the index
    var reviewFile = company.f || '';
    if (!reviewFile || !company.i) {
      renderNoReviews();
      return;
    }
    // Step 3: Load the specific review file
    fetch(base + 'data/reviews/' + reviewFile + '.json').then(function(r){
      if (!r.ok) throw new Error('not found');
      return r.json();
    }).then(function(chunk){
      var entry = chunk[company.i];
      var reviewList = entry ? (entry.reviews || []) : [];
      renderReviews(company, reviewList);
    }).catch(function(){
      // Fallback: try loading the full reviews.json
      fetch(base + 'data/reviews.json').then(function(r){return r.json()}).then(function(allReviews){
        var entry = allReviews[company.i];
        var reviewList = entry ? (entry.reviews || []) : [];
        renderReviews(company, reviewList);
      }).catch(function(){
        renderNoReviews();
      });
    });
  }).catch(function(e){
    document.getElementById('companyPage').innerHTML = '<div class="error-page"><h2>加载失败</h2><p>请刷新页面重试</p><a href="search.html" class="btn btn-outline">返回搜索</a></div>';
  });

  function renderCompanyHeader(company) {
    var h = '<a href="search.html" class="back-link">← 返回搜索</a>';
    h += '<div class="sidebar-layout"><div>';
    h += '<div class="card detail-header">';
    h += '<div class="detail-avatar">' + esc(company.n.charAt(0)) + '</div>';
    h += '<div><div class="detail-title">' + esc(company.n) + '</div>';
    h += '<div class="detail-subtitle">';
    if (company.c) h += '<span class="tag tag-gray">' + esc(company.c) + '</span>';
    h += '<span class="badge badge-blue">' + company.r + ' 条评价</span>';
    h += '</div></div></div>';
    h += '<div class="compliance-note">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务，不对评价内容的真实性、准确性负责。</div>';
    h += '<h2 style="font-size:18px;font-weight:700;margin-bottom:16px">员工评价</h2>';
    h += '<div class="loading"><div class="spinner"></div><p>评价加载中...</p></div>';
    h += '</div><div>';
    h += '<div class="sidebar-card"><div class="sidebar-title">企业申诉</div><div class="sidebar-text">如果您是该企业负责人，可对不实评价进行申诉</div><a href="complaint.html" class="btn btn-outline btn-sm" style="width:100%;display:inline-flex">发起申诉</a></div>';
    h += '<div class="sidebar-card"><div class="sidebar-title">企业信息</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#94a3b8">城市</span><span>' + esc(company.c || '-') + '</span></div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#94a3b8">评价数</span><span>' + company.r + ' 条</span></div>';
    h += '</div></div></div>';
    document.getElementById('companyPage').innerHTML = h;
  }

  function renderReviews(company, reviewList) {
    var h = '<a href="search.html" class="back-link">← 返回搜索</a>';
    h += '<div class="sidebar-layout"><div>';
    h += '<div class="card detail-header">';
    h += '<div class="detail-avatar">' + esc(company.n.charAt(0)) + '</div>';
    h += '<div><div class="detail-title">' + esc(company.n) + '</div>';
    h += '<div class="detail-subtitle">';
    if (company.c) h += '<span class="tag tag-gray">' + esc(company.c) + '</span>';
    h += '<span class="badge badge-blue">' + company.r + ' 条评价</span>';
    h += '</div></div></div>';
    h += '<div class="compliance-note">以上评价均为用户个人观点，不代表本平台立场。本平台仅提供信息展示服务，不对评价内容的真实性、准确性负责。</div>';
    h += '<h2 style="font-size:18px;font-weight:700;margin-bottom:16px">员工评价（共 ' + reviewList.length + ' 条）</h2>';
    if (reviewList.length === 0) {
      h += '<div class="card" style="text-align:center;padding:40px"><p style="color:#94a3b8">暂无评价</p></div>';
    } else {
      for (var j = 0; j < reviewList.length; j++) {
        var r = reviewList[j];
        h += '<div class="card review-card">';
        h += '<div class="review-header"><div class="review-avatar">匿</div><div>';
        h += '<div class="review-author">匿名用户</div>';
        h += '<div class="review-meta">' + esc(r.city || company.c || '') + ' · 来源数 ' + (r.sourceCount || 1) + '</div>';
        h += '</div></div>';
        if (r.tags && r.tags.length > 0) {
          h += '<div class="review-tags">';
          for (var k = 0; k < r.tags.length; k++) {
            h += '<span class="tag tag-blue">' + esc(r.tags[k]) + '</span>';
          }
          h += '</div>';
        }
        h += '<div class="review-content">' + esc(r.content || '') + '</div>';
        if (r.issues) {
          h += '<div class="review-issues"><div class="review-issues-title">主要问题</div><div class="review-issues-text">' + esc(r.issues) + '</div></div>';
        }
        h += '</div>';
      }
    }
    h += '</div><div>';
    h += '<div class="sidebar-card"><div class="sidebar-title">企业申诉</div><div class="sidebar-text">如果您是该企业负责人，可对不实评价进行申诉</div><a href="complaint.html" class="btn btn-outline btn-sm" style="width:100%;display:inline-flex">发起申诉</a></div>';
    h += '<div class="sidebar-card"><div class="sidebar-title">企业信息</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:#94a3b8">城市</span><span>' + esc(company.c || '-') + '</span></div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#94a3b8">评价数</span><span>' + company.r + ' 条</span></div>';
    h += '</div></div></div>';
    document.getElementById('companyPage').innerHTML = h;
  }

  function renderNoReviews() {
    document.getElementById('companyPage').innerHTML = document.getElementById('companyPage').innerHTML.replace(
      '<div class="loading"><div class="spinner"></div><p>评价加载中...</p></div>',
      '<div class="card" style="text-align:center;padding:40px"><p style="color:#94a3b8">暂无评价</p></div>'
    );
  }
})();
</script>
</main>
<footer class="footer">
  <div class="container">
    <div class="footer-links">
      <a href="legal/user-agreement.html">用户协议</a>
      <a href="legal/privacy-policy.html">隐私政策</a>
      <a href="legal/disclaimer.html">免责声明</a>
      <a href="legal/review-convention.html">评价公约</a>
      <a href="legal/complaint-rules.html">申诉规则</a>
      <a href="legal/qualification.html">资质公示</a>
    </div>
    <p>企业点评平台 - 真实员工评价 | 仅供信息参考</p>
  </div>
</footer>
</body>
</html>
