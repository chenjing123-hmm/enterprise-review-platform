<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 - 职得</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"></noscript>
<style>*,::before,::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f5f7;
  --bg-secondary:#fafafa;
  --surface:#ffffff;
  --text-primary:#1d1d1f;
  --text-secondary:#6e6e73;
  --text-tertiary:#aeaeb2;
  --blue:#0071e3;
  --blue-hover:#0077ed;
  --blue-light:#e8f4fd;
  --red:#ff3b30;
  --red-light:#ffeeed;
  --green:#34c759;
  --green-light:#e8f8ed;
  --orange:#ff9500;
  --orange-light:#fff4e5;
  --border:#d2d2d7;
  --border-light:#e5e5ea;
  --separator:rgba(60,60,67,0.08);
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06),0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.08),0 4px 8px rgba(0,0,0,0.04);
  --shadow-xl:0 20px 60px rgba(0,0,0,0.1),0 8px 16px rgba(0,0,0,0.04);
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --radius-xl:24px;
  --radius-pill:980px;
  --font:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',-apple-system,sans-serif;
  --font-display:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
  --transition-fast:.15s cubic-bezier(.4,0,.2,1);
  --transition-smooth:.3s cubic-bezier(.4,0,.2,1);
  --transition-spring:.4s cubic-bezier(.25,.1,.25,1);
}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-size:17px;
  letter-spacing:-.01em;
}

::selection{background:rgba(0,113,227,.2);color:var(--text-primary)}

a{color:var(--blue);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--blue-hover)}

.container{max-width:1040px;margin:0 auto;padding:0 32px}

/* ===== TYPOGRAPHY ===== */
h1{font-size:56px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
h2{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h3{font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.2}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 28px;border-radius:var(--radius-pill);font-size:15px;font-weight:600;
  cursor:pointer;border:none;transition:all var(--transition-smooth);text-decoration:none;
  font-family:var(--font);letter-spacing:-.01em;position:relative;overflow:hidden;
}
.btn-primary{
  background:var(--blue);color:#fff;
}
.btn-primary:hover{background:#0077ed;color:#fff;text-decoration:none}
.btn-outline{
  border:1.5px solid var(--border);color:var(--text-primary);background:transparent;
}
.btn-outline:hover{background:rgba(0,0,0,0.03);border-color:var(--text-tertiary);text-decoration:none;color:var(--text-primary)}
.btn-ghost{
  background:transparent;color:var(--text-secondary);padding:8px 18px;
}
.btn-ghost:hover{background:rgba(0,0,0,0.04);color:var(--text-primary);text-decoration:none}
.btn-sm{padding:8px 18px;font-size:13px;border-radius:var(--radius-pill)}
.btn-lg{padding:16px 36px;font-size:17px;border-radius:var(--radius-pill);font-weight:600}

/* ===== INPUTS ===== */
input,textarea,select{
  width:100%;padding:14px 18px;border:1.5px solid var(--border);
  border-radius:var(--radius);font-size:16px;outline:none;
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
  background:var(--surface);font-family:var(--font);color:var(--text-primary);
}
input:focus,textarea:focus,select:focus{
  border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-light);
}
textarea{resize:vertical;min-height:140px;line-height:1.7}

/* ===== TAGS ===== */
.tag{
  display:inline-flex;align-items:center;padding:5px 14px;
  border-radius:var(--radius-pill);font-size:12px;font-weight:500;letter-spacing:.01em;
}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-red{background:var(--red-light);color:var(--red)}
.tag-orange{background:var(--orange-light);color:var(--orange)}
.tag-neutral{background:rgba(0,0,0,0.04);color:var(--text-secondary)}

.badge{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:var(--radius-pill);font-size:11px;font-weight:600;letter-spacing:.02em;
}
.badge-dark{background:var(--text-primary);color:#fff}
.badge-blue{background:var(--blue-light);color:var(--blue)}

/* ===== SPINNER ===== */
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HEADER: Apple glassmorphism ===== */
.header{
  background:rgba(245,245,247,.72);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  position:sticky;top:0;z-index:100;border-bottom:1px solid transparent;
  box-shadow:0 1px 0 var(--separator);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;height:52px;
}
.logo{
  font-family:var(--font-display);font-size:20px;font-weight:700;
  color:var(--text-primary);display:flex;align-items:center;gap:10px;text-decoration:none;
  letter-spacing:-.02em;
}
.logo:hover{text-decoration:none;color:var(--text-primary)}
.logo-mark{
  width:32px;height:32px;background:var(--text-primary);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:700;font-family:var(--font);
}
.nav{display:flex;align-items:center;gap:4px}
.nav a{
  padding:7px 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;
  color:var(--text-secondary);transition:all var(--transition-fast);text-decoration:none;
  letter-spacing:-.01em;
}
.nav a:hover,.nav a.active{
  color:var(--text-primary);text-decoration:none;
}
.nav a.active{background:rgba(0,0,0,0.04)}
.nav a.nav-accent{
  background:var(--blue);color:#fff;font-weight:600;
}
.nav a.nav-accent:hover{background:var(--blue-hover);color:#fff}

/* ===== FOOTER ===== */
.footer{
  background:var(--surface);border-top:1px solid var(--separator);
  padding:64px 0 40px;margin-top:100px;
}
.footer-grid{
  display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px;
  margin-bottom:48px;
}
.footer-brand{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.footer-desc{font-size:14px;line-height:1.8;color:var(--text-secondary)}
.footer-title{font-size:12px;font-weight:600;color:var(--text-primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.footer-links{display:flex;flex-direction:column;gap:10px}
.footer-links a{font-size:14px;color:var(--text-secondary);text-decoration:none;transition:color var(--transition-fast)}
.footer-links a:hover{color:var(--blue)}
.footer-bottom{
  border-top:1px solid var(--separator);
  padding-top:24px;text-align:center;font-size:13px;color:var(--text-tertiary);
}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;gap:32px}}

/* ===== BANNER ===== */
.banner{
  background:var(--blue-light);padding:10px 0;text-align:center;
  font-size:13px;color:var(--blue);font-weight:500;letter-spacing:.01em;
  border-bottom:1px solid rgba(0,113,227,.1);
}

/* ===== CARDS ===== */
.card{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:28px;box-shadow:var(--shadow-xs);
  transition:box-shadow var(--transition-smooth),transform var(--transition-smooth);
  border:1px solid transparent;
}
.card-hover:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-light)}

/* ===== PAGE LAYOUT ===== */
.page{padding:60px 0}
.page-header{margin-bottom:40px;text-align:center}
.page-title{
  font-size:48px;font-weight:800;color:var(--text-primary);
  margin-bottom:8px;letter-spacing:-.025em;
}
.page-subtitle{font-size:19px;color:var(--text-secondary);font-weight:400}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes fadeInScale{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}
@keyframes subtleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* Entrance classes */
.anim-fade-in{animation:fadeIn .5s ease-out}
.anim-fade-up{animation:fadeInUp .5s ease-out}
.anim-fade-scale{animation:fadeInScale .4s ease-out}
.anim-delay-1{animation-delay:.1s;animation-fill-mode:both}
.anim-delay-2{animation-delay:.2s;animation-fill-mode:both}
.anim-delay-3{animation-delay:.3s;animation-fill-mode:both}
.anim-delay-4{animation-delay:.4s;animation-fill-mode:both}
.anim-delay-5{animation-delay:.5s;animation-fill-mode:both}

/* ===== SCROLL REVEAL ===== */
.reveal{
  opacity:0;transform:translateY(24px);
  transition:opacity .7s cubic-bezier(.25,.1,.25,1),transform .7s cubic-bezier(.25,.1,.25,1);
}
.reveal.revealed{opacity:1;transform:translateY(0)}
.reveal-left{opacity:0;transform:translateX(-24px);transition:opacity .6s ease-out,transform .6s ease-out}
.reveal-left.revealed{opacity:1;transform:translateX(0)}
.reveal-right{opacity:0;transform:translateX(24px);transition:opacity .6s ease-out,transform .6s ease-out}
.reveal-right.revealed{opacity:1;transform:translateX(0)}
.reveal-scale{opacity:0;transform:scale(.92);transition:opacity .6s ease-out,transform .6s ease-out}
.reveal-scale.revealed{opacity:1;transform:scale(1)}
.delay-1{transition-delay:.1s}
.delay-2{transition-delay:.2s}
.delay-3{transition-delay:.3s}
.delay-4{transition-delay:.4s}
.delay-5{transition-delay:.5s}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--text-primary);color:#fff;padding:14px 28px;
  border-radius:var(--radius-pill);font-size:15px;font-weight:500;
  z-index:10000;box-shadow:var(--shadow-lg);
  animation:fadeInUp .3s ease-out;
  pointer-events:none;
}

/* ===== RIPPLE EFFECT ===== */
.ripple-effect{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.3);
  transform:scale(0);animation:ripple .6s ease-out;
  pointer-events:none;
}
@keyframes ripple{
  to{transform:scale(4);opacity:0}
}

/* ===== HEADER SCROLLED STATE ===== */
.header.scrolled{
  background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm);
}

/* ===== COUNTING ANIMATION ===== */
.stat-num.counting{
  animation:countPop .4s ease-out;
}
@keyframes countPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

/* ===== 3D CARD TILT ===== */
.card-tilt{
  transform-style:preserve-3d;perspective:1000px;
  transition:transform .3s ease-out;
}
.card-tilt:hover{
  transform:rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));
}

/* ===== BACK TO TOP PROGRESS ===== */
.back-to-top-progress{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--blue) var(--btp-pct,0%),transparent var(--btp-pct,0%));
  mask:radial-gradient(transparent 55%,#000 56%);
  -webkit-mask:radial-gradient(transparent 55%,#000 56%);
}

/* ===== HERO ===== */
.hero{
  padding:100px 0 80px;text-align:center;position:relative;overflow:hidden;
  background:var(--surface);
}
.hero h1{
  font-size:64px;font-weight:800;letter-spacing:-.03em;
  margin-bottom:20px;color:var(--text-primary);
  line-height:1.1;
}
.hero h1 .gradient-text{
  background:linear-gradient(135deg,var(--blue),#5856d6);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:gradientShift 4s ease infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.hero p{
  font-size:21px;color:var(--text-secondary);max-width:600px;
  margin:0 auto 36px;line-height:1.5;font-weight:400;
}
.hero-search{
  display:flex;max-width:560px;margin:0 auto 40px;gap:8px;
}
.hero-search input{
  flex:1;padding:16px 24px;font-size:17px;border-radius:var(--radius-pill);
  border:2px solid var(--border);background:var(--bg);
  transition:all var(--transition-smooth);
}
.hero-search input:focus{
  border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-light);
  background:var(--surface);
}
.hero-search button{
  padding:16px 32px;font-size:17px;border-radius:var(--radius-pill);
  white-space:nowrap;font-weight:600;
}

/* ===== STATS BAR ===== */
.stats-bar{
  display:inline-flex;align-items:center;gap:40px;
  padding:20px 48px;background:var(--bg);border-radius:var(--radius-lg);
  border:1px solid var(--border-light);
}
.stat-item{text-align:center}
.stat-num{font-size:32px;font-weight:800;color:var(--text-primary);letter-spacing:-.02em;line-height:1.2}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px;font-weight:500}
.stat-divider{width:1px;height:32px;background:var(--border-light)}

/* ===== SECTION TITLE ===== */
.section-title{
  font-size:32px;font-weight:700;text-align:center;
  margin-bottom:8px;letter-spacing:-.02em;
}
.section-subtitle{
  font-size:17px;color:var(--text-secondary);text-align:center;
  margin-bottom:32px;font-weight:400;
}

/* ===== CITY FILTER ===== */
.city-filter{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px 0;
}
.city-btn{
  padding:8px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);
  cursor:pointer;transition:all var(--transition-fast);text-decoration:none;
}
.city-btn:hover,.city-btn.active{
  border-color:var(--text-primary);background:var(--text-primary);
  color:#fff;text-decoration:none;
}

/* ===== COMPANY GRID ===== */
.company-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
  margin-top:24px;
}
.company-card{
  display:block;padding:24px;cursor:pointer;transition:all var(--transition-smooth);
  text-decoration:none;color:inherit;border:1px solid transparent;
}
.company-card:hover{border-color:var(--border-light);box-shadow:var(--shadow-md);text-decoration:none}
.company-card-header{display:flex;align-items:flex-start;gap:14px}
.company-avatar{
  width:44px;height:44px;background:linear-gradient(135deg,var(--blue-light),#dceeff);
  border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--blue);flex-shrink:0;
}
.company-name{font-size:16px;font-weight:600;color:var(--text-primary);line-height:1.3}
.company-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.company-stats{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--separator)}
.company-review-count{font-size:13px;color:var(--text-secondary);font-weight:500}
.company-arrow{font-size:13px;color:var(--blue);font-weight:600;opacity:0;transition:opacity var(--transition-fast)}
.company-card:hover .company-arrow{opacity:1}

/* ===== COMPANY DETAIL ===== */
.detail-header{display:flex;align-items:flex-start;gap:24px;margin-bottom:28px;padding:32px}
.detail-avatar{
  width:72px;height:72px;background:linear-gradient(135deg,var(--blue-light),#dceeff);
  border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;color:var(--blue);flex-shrink:0;
}
.detail-title{font-size:28px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em}
.detail-subtitle{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ===== REVIEW CARDS ===== */
.review-card{padding:24px;margin-bottom:12px}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.review-avatar{
  width:40px;height:40px;background:var(--bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--text-secondary);flex-shrink:0;
}
.review-author{font-size:15px;font-weight:600;color:var(--text-primary)}
.review-meta{font-size:13px;color:var(--text-tertiary)}
.review-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.review-content{font-size:15px;line-height:1.7;color:var(--text-secondary);white-space:pre-line}

/* ===== PAGINATION ===== */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:32px}
.pagination a,.pagination span{
  padding:8px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;
  border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);
  text-decoration:none;transition:all var(--transition-fast);
}
.pagination a:hover{border-color:var(--blue);color:var(--blue);text-decoration:none}
.pagination .active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pagination .disabled{opacity:.3;pointer-events:none}

/* ===== FORM ===== */
.form-group{margin-bottom:24px}
.form-label{font-size:15px;font-weight:600;color:var(--text-primary);display:block;margin-bottom:8px}
.form-hint{font-size:13px;color:var(--text-tertiary);margin-top:6px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-pill{position:relative}
.checkbox-pill input{position:absolute;opacity:0;width:0;height:0}
.checkbox-pill label{
  display:inline-flex;padding:8px 18px;border-radius:var(--radius-pill);
  border:1.5px solid var(--border);font-size:13px;font-weight:500;
  cursor:pointer;transition:all var(--transition-fast);color:var(--text-secondary);
  user-select:none;
}
.checkbox-pill input:checked+label{
  background:var(--blue);color:#fff;border-color:var(--blue);
}
.checkbox-pill input:focus-visible+label{box-shadow:0 0 0 3px var(--blue-light)}
.compliance-note{
  background:var(--blue-light);border:1px solid rgba(0,113,227,.1);
  border-radius:var(--radius);padding:14px 18px;font-size:13px;
  color:var(--blue);line-height:1.6;margin-bottom:20px;
}

/* ===== SUCCESS STATE ===== */
.success-state{text-align:center;padding:60px 20px}
.success-icon{
  width:72px;height:72px;background:var(--green-light);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--green);margin-bottom:20px;
  animation:fadeInScale .4s ease-out;
}
.success-title{font-size:24px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.success-text{font-size:16px;color:var(--text-secondary);margin-bottom:24px;max-width:400px;margin-left:auto;margin-right:auto}

/* ===== BACK LINK ===== */
.back-link{
  display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--text-secondary);
  margin-bottom:24px;text-decoration:none;transition:color var(--transition-fast);
}
.back-link:hover{color:var(--blue);text-decoration:none}
.back-link svg{width:16px;height:16px}

/* ===== LEGAL ===== */
.legal-content{max-width:720px;margin:0 auto}
.legal-content h2{font-size:22px;font-weight:700;margin:32px 0 14px;color:var(--text-primary);letter-spacing:-.015em}
.legal-content h3{font-size:18px;margin:24px 0 10px}
.legal-content p,.legal-content li{font-size:15px;line-height:1.8;color:var(--text-secondary);margin-bottom:10px}
.legal-content ul{padding-left:24px}

/* ===== SEARCH BOX ===== */
.search-box{display:flex;max-width:560px;margin:0 auto 20px;gap:8px}
.search-box input{flex:1;padding:14px 22px;font-size:16px;border-radius:var(--radius-pill);border:2px solid var(--border)}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-light)}
.search-box button{padding:14px 28px;font-size:16px;border-radius:var(--radius-pill);white-space:nowrap;font-weight:600}

/* ===== RESULT COUNT ===== */
.result-count{font-size:14px;color:var(--text-secondary);margin-bottom:8px;text-align:center}
.result-count strong{color:var(--text-primary)}

/* ===== LOADING/EMPTY/ERROR ===== */
.loading{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty{text-align:center;padding:80px 20px;color:var(--text-secondary)}
.empty h3{font-size:20px;color:var(--text-primary);margin-bottom:8px}
.empty p{font-size:15px;color:var(--text-secondary)}
.error-page{text-align:center;padding:80px 20px}
.error-page h2{font-size:22px;color:var(--text-primary);margin-bottom:8px}
.error-page p{color:var(--text-secondary);margin-bottom:20px;font-size:15px}

/* ===== SKELETON ===== */
.skeleton-card{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:24px;overflow:hidden;position:relative;
}
.skeleton-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.6) 50%,transparent 100%);
  animation:shimmer 1.5s ease-in-out infinite;
}
.skeleton-line{height:14px;background:var(--bg);border-radius:7px;margin-bottom:10px}
.skeleton-line:last-child{margin-bottom:0;width:60%}
.skeleton-line-sm{height:10px;width:40%}
.skeleton-avatar{width:44px;height:44px;background:var(--bg);border-radius:var(--radius);flex-shrink:0}
.skeleton-header{display:flex;gap:14px;align-items:center;margin-bottom:16px}

/* ===== SCROLL PROGRESS ===== */
.scroll-progress{
  position:fixed;top:0;left:0;width:100%;height:2px;z-index:200;
  background:transparent;pointer-events:none;
}
.scroll-progress::after{
  content:'';display:block;width:100%;height:100%;
  background:linear-gradient(90deg,var(--blue),#5856d6);
  transform-origin:left;transform:scaleX(var(--scroll-pct,0));
  transition:transform .1s linear;
}

/* ===== BACK TO TOP ===== */
.back-to-top{
  position:fixed;bottom:32px;right:32px;z-index:150;
  width:44px;height:44px;border-radius:50%;
  background:var(--surface);color:var(--text-primary);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-md);border:1px solid var(--border-light);
  opacity:0;transform:translateY(16px);pointer-events:none;
  transition:all var(--transition-smooth);
}
.back-to-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.back-to-top:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);color:var(--blue)}
.back-to-top svg{width:18px;height:18px;transition:transform var(--transition-fast)}
.back-to-top:hover svg{transform:translateY(-2px)}

/* ===== FOCUS-VISIBLE ===== */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.btn:focus-visible,.nav a:focus-visible{outline-offset:0;border-radius:var(--radius-pill)}

/* ===== PRINT ===== */
@media print{
  .header,.footer,.banner,.nav,.back-to-top,.scroll-progress,.nav-overlay{display:none!important}
  body{background:#fff!important;color:#000!important;font-size:12pt}
  .card,.review-card{border:1px solid #ddd;box-shadow:none;break-inside:avoid}
  .container{max-width:100%;padding:0}
  .hero{padding:20px 0;text-align:left}
  .page-title{font-size:18pt}
  a{color:#000;text-decoration:underline}
}

/* ===== REDUCED MOTION ===== */
@media(prefers-reduced-motion:reduce){
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  .container{padding:0 24px}
  h1{font-size:44px}
  .hero h1{font-size:48px}
  .page-title{font-size:36px}
  .hero{padding:72px 0 56px}
}
@media(max-width:768px){
  .container{padding:0 20px}
  h1{font-size:36px}
  h2{font-size:28px}
  .hero h1{font-size:40px}
  .hero p{font-size:17px}
  .page-title{font-size:32px}
  .hero{padding:56px 0 40px}
  .hero-search{flex-direction:column}
  .hero-search button{width:100%}
  .stats-bar{gap:24px;padding:16px 24px;flex-wrap:wrap}
  .stat-num{font-size:24px}
  .company-grid{grid-template-columns:1fr}
  .detail-header{flex-direction:column;align-items:center;text-align:center}
  .detail-subtitle{justify-content:center}
  .search-box{flex-direction:column}
  .search-box button{width:100%}

  /* Mobile nav */
  .menu-toggle{display:flex!important}
  .nav{display:none}
  .menu-open .nav{display:flex;flex-direction:column;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);padding:20px;gap:4px;z-index:99;overflow-y:auto}
  .menu-open .nav a{padding:14px 20px;font-size:16px;width:100%;border-radius:var(--radius)}
  .nav-overlay{display:none}
  .menu-open .nav-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:98;top:52px}
}
@media(max-width:480px){
  .container{padding:0 16px}
  h1{font-size:30px}
  .hero h1{font-size:32px}
  .hero p{font-size:16px}
  .page-title{font-size:26px}
  .hero{padding:40px 0 32px}
  .stats-bar{gap:16px;padding:14px 16px}
  .stat-num{font-size:20px}
  .stat-label{font-size:12px}
  .footer{padding:40px 0 24px}
}

/* Menu toggle */
.menu-toggle{
  display:none;flex-direction:column;justify-content:center;gap:5px;
  width:36px;height:36px;padding:6px;background:transparent;border:none;
  cursor:pointer;z-index:101;position:relative;
}
.menu-toggle span,.menu-toggle::before,.menu-toggle::after{
  content:'';display:block;width:100%;height:2px;background:var(--text-primary);
  border-radius:1px;transition:all var(--transition-fast);
}
.menu-open .menu-toggle::before{transform:translateY(7px) rotate(45deg)}
.menu-open .menu-toggle::after{transform:translateY(-7px) rotate(-45deg)}
.menu-open .menu-toggle span{opacity:0}

/* ===== SIDEBAR ===== */
.sidebar-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
@media(max-width:768px){.sidebar-layout{grid-template-columns:1fr}}
.sidebar-card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-xs);border:1px solid var(--border-light)}
.sidebar-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.sidebar-text{font-size:14px;color:var(--text-secondary);margin-bottom:14px;line-height:1.6}
.review-source-text{font-size:13px;color:var(--text-tertiary);margin-top:10px;padding-top:10px;border-top:1px solid var(--separator)}
.review-card-glow{transition:box-shadow var(--transition-smooth),border-color var(--transition-smooth)}
.review-card-glow:hover{box-shadow:var(--shadow-md);border-color:var(--border-light)}
</style>
</head>
<body>
<div class="banner">以上评价均为用户个人观点，不代表本平台立场。</div>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">评</div>职得
    </a>
    <button class="menu-toggle" onclick="document.body.classList.toggle('menu-open')" aria-label="菜单">
      <span></span>
    </button>
    <div class="nav-overlay" onclick="document.body.classList.remove('menu-open')"></div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="search.html">企业搜索</a>
      <a href="reviews.html">最新评价</a>
      <a href="complaint.html">企业申诉</a>
      <a href="post.html" class="nav-accent">写评价</a>
    </nav>
  </div>
</header>

<main class="container">
<div class="page">
  <div class="error-page" style="padding:100px 20px">
    <div style="font-family:var(--font-display);font-size:72px;font-weight:900;color:var(--blue);opacity:.3;margin-bottom:16px">404</div>
    <h2>页面未找到</h2>
    <p>您访问的页面不存在或已被移除</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px">
      <a href="index.html" class="btn btn-primary">返回首页</a>
      <a href="search.html" class="btn btn-outline">搜索企业</a>
    </div>
  </div>
</div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">职得</div>
        <div class="footer-desc">真实员工评价平台，帮助求职者了解企业真实情况。所有评价均来自用户分享，仅供信息参考。</div>
      </div>
      <div>
        <div class="footer-title">法律信息</div>
        <div class="footer-links">
          <a href="legal/user-agreement.html">用户协议</a>
          <a href="legal/privacy-policy.html">隐私政策</a>
          <a href="legal/disclaimer.html">免责声明</a>
        </div>
      </div>
      <div>
        <div class="footer-title">平台规则</div>
        <div class="footer-links">
          <a href="legal/review-convention.html">评价公约</a>
          <a href="legal/complaint-rules.html">申诉规则</a>
          <a href="legal/qualification.html">资质公示</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">职得 · 真实员工评价平台 | 仅供信息参考</div>
  </div>
</footer>
<script>
// Close mobile nav when a nav link is clicked
document.querySelectorAll('.nav a').forEach(function(a) {
  a.addEventListener('click', function() {
    document.body.classList.remove('menu-open');
  });
});

// Header scroll shadow
(function(){
  var header = document.querySelector('.header');
  var lastScroll = 0;
  window.addEventListener('scroll', function(){
    var scrollY = window.scrollY;
    if (scrollY > 10) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
    lastScroll = scrollY;
  }, {passive: true});
})();

// IntersectionObserver for scroll reveal
(function(){
  if (!('IntersectionObserver' in window)) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        observer.unobserve(entry.target);
      }
    });
  }, {threshold: 0.15, rootMargin: '0px 0px -40px 0px'});
  document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(function(el) {
    observer.observe(el);
  });
})();

// Button ripple effect
(function(){
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.btn');
    if (!btn) return;
    var ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
  });
})();

// Stats counter animation
(function(){
  var animated = false;
  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && !animated) {
      animated = true;
      document.querySelectorAll('.stat-num').forEach(function(el) {
        el.classList.add('counting');
        setTimeout(function() { el.classList.remove('counting'); }, 400);
      });
    }
  }, {threshold: 0.5});
  var statsBar = document.querySelector('.stats-bar');
  if (statsBar) observer.observe(statsBar);
})();

// Scroll progress bar
(function(){
  var bar = document.createElement('div');
  bar.className = 'scroll-progress';
  document.body.prepend(bar);
  window.addEventListener('scroll', function(){
    var h = document.documentElement;
    var pct = h.scrollTop / (h.scrollHeight - h.clientHeight) || 0;
    bar.style.setProperty('--scroll-pct', pct);
  }, {passive: true});
})();

// 3D card tilt on hover
(function(){
  document.querySelectorAll('.card-tilt').forEach(function(card){
    card.addEventListener('mousemove', function(e){
      var rect = card.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var cx = rect.width / 2;
      var cy = rect.height / 2;
      var rotateX = (y - cy) / cy * -5;
      var rotateY = (x - cx) / cx * 5;
      card.style.setProperty('--tilt-x', rotateX + 'deg');
      card.style.setProperty('--tilt-y', rotateY + 'deg');
    });
    card.addEventListener('mouseleave', function(){
      card.style.setProperty('--tilt-x', '0deg');
      card.style.setProperty('--tilt-y', '0deg');
    });
  });
})();

// Update user review count
(function(){
  try {
    var stored = localStorage.getItem('zde_user_reviews');
    if (stored) {
      var reviews = JSON.parse(stored);
      var el = document.getElementById('userReviewCount');
      if (el) el.textContent = reviews.length;
    }
  } catch(e) {}
})();

// Back to top button with scroll progress
(function(){
  var btn = document.createElement('button');
  btn.className = 'back-to-top';
  btn.setAttribute('aria-label', '返回顶部');
  btn.innerHTML = '<span class="back-to-top-progress"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
  document.body.appendChild(btn);
  btn.addEventListener('click', function(){
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (!ticking) {
      requestAnimationFrame(function(){
        var scrollY = window.scrollY;
        var docH = document.documentElement;
        var totalH = docH.scrollHeight - docH.clientHeight;
        var pct = totalH > 0 ? Math.min(scrollY / totalH * 100, 100) : 0;
        if (scrollY > 400) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
        btn.style.setProperty('--btp-pct', pct + '%');
        ticking = false;
      });
      ticking = true;
    }
  }, {passive: true});
})();

// Animated number counter
(function(){
  if (!('IntersectionObserver' in window)) return;
  var counters = document.querySelectorAll('.stat-num[data-count]');
  if (!counters.length) return;
  var animated = {};
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting && !animated[entry.target.id || entry.target.textContent]) {
        var el = entry.target;
        animated[el.id || el.textContent] = true;
        var target = parseInt(el.getAttribute('data-count'));
        var duration = 1500;
        var startTime = null;
        function animate(ts){
          if (!startTime) startTime = ts;
          var progress = Math.min((ts - startTime) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = Math.floor(eased * target).toLocaleString();
          if (progress < 1) requestAnimationFrame(animate);
          else el.textContent = target.toLocaleString();
        }
        requestAnimationFrame(animate);
      }
    });
  }, {threshold: 0.3});
  counters.forEach(function(c){ observer.observe(c); });
})();

// Keyboard shortcut: press / to focus search
(function(){
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && !e.target.closest('input,textarea,select,[contenteditable]')) {
      e.preventDefault();
      var searchInput = document.getElementById('heroSearch') || document.getElementById('searchInput');
      if (searchInput) searchInput.focus();
    }
  });
})();</script>
</body>
</html>
